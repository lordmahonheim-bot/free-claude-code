# Provider Rotation model rings.
#
# This file is intentionally inactive unless ENABLE_PROVIDER_ROTATION=true.
# It defines task-oriented candidate rings used by the experimental rotation
# engine. Model availability must be validated by live smoke tests before
# production use.

profiles:
  stable-agentic:
    default_ring: code_agentic
    weights:
      quality: 0.35
      stability: 0.25
      tool_use: 0.20
      latency: 0.10
      cost: 0.05
      privacy: 0.05

  code-max:
    default_ring: code_agentic
    weights:
      quality: 0.45
      tool_use: 0.25
      stability: 0.15
      latency: 0.05
      cost: 0.05
      privacy: 0.05

  fast-resilient:
    default_ring: fast
    weights:
      latency: 0.40
      stability: 0.25
      tool_use: 0.15
      quality: 0.10
      cost: 0.05
      privacy: 0.05

  long-context-docs:
    default_ring: long_context
    weights:
      context: 0.35
      quality: 0.25
      stability: 0.15
      tool_use: 0.10
      latency: 0.05
      cost: 0.05
      privacy: 0.05

  private-local:
    default_ring: private_local
    weights:
      privacy: 0.60
      stability: 0.20
      latency: 0.10
      quality: 0.05
      tool_use: 0.05

rings:
  code_agentic:
    - model_ref: cloudflare/@cf/moonshotai/kimi-k2.6
      priority: 100
      weight: 1.0
      capabilities: [chat, streaming, tools, rate_limit, multimodal, long_context]
